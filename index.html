<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>After School Classes</title>
        <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    </head>
    <body>
        <div id = "app">
           
            <header>
                <h1 v-text="sitename"></h1>
            </header>
            <main>
                <div v-for="course in courses">
                    <h2 v-text="course.subject"></h2>
                    <p v-html="course.description"></p>
                    <p>Location: {{courses.location}}</p>
                    <p>Price: {{courses.price}}</p>
                    <p>Available Space: {{courses.availableSpace}} </p>
                </div>
               
                
            </main>
        </div>
        <script type = "text/javascript">
            let webstore = new Vue({
                el: '#app',
                data: {
                    sitename: "Book Your After School Classes",
                    courses: [
                        {
                            id: 1001,
                            subject: 'Swimming',
                            description: "This is a Swimming Class!",
                            location: "<b>6th Avenue, London</b>",
                            price: 2000,
                            availableSpace: 5,
                        },
                        {
                            id: 1002,
                            subject: 'Maths',
                            description: "This is a Maths Class!",
                            location: "<b>6th Avenue, Westford</b>",
                            price: 1000,
                            availableSpace: 5,

                        }
                        
                    ]
                },
            });  
            
        </script>
    </body>
</html>
